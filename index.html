<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>知行日志</title>
<meta name="description" content="基于行为科学与古典教育理想的习惯、待办、专注与记忆应用，可多人共用，数据保存在你的 GitHub 私有仓库。">
<meta name="theme-color" content="#ECEEE8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1216" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="知行日志">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@600;800&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: 知行日志 · a notebook page on a graph-paper desk. iPad ≥800px: list sidebar + page; phone: page + four tabs + round add button */
:root{
  --paper:#ECEEE8; --sheet:#FCFCFA; --sheet-2:#EEF0EA; --sunk:#E3E6DF;
  --ink:#151A1F; --ink-2:#4A525A; --ink-3:#767D84; --rule:#DADDD6; --rule-2:#C2C7BF;
  --indigo:#3243B0; --indigo-2:#283794; --indigo-soft:#E1E5F7; --on-indigo:#FFFFFF;
  --moss:#2B6F55; --moss-soft:#D9EADF;
  --amber:#8F5600; --amber-soft:#F4E6CC;
  --rust:#B23827; --rust-soft:#F4DDD8;
  --seal:#A23A2B; --seal-ink:#FFF7F3;
  --grid:rgba(50,67,176,.05);
  --h0:#E2E5DF; --h1:#C8CEF0; --h2:#98A4E6; --h3:#6273D5; --h4:#3243B0;
  --c0:#2A78D6; --c1:#D95926; --c2:#148A5F; --c3:#A86F00; --c4:#C2507E; --c5:#2F7D32; --c6:#6250D6; --c7:#C43D3C;
  --veil:rgba(14,17,21,.42);
  --shadow:0 1px 0 rgba(22,27,32,.04),0 14px 34px -18px rgba(22,27,32,.32);
  --page-shadow:0 0 0 1px rgba(22,27,32,.04),0 18px 40px -28px rgba(22,27,32,.35);
  --f-disp:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --f-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px; --tab-h:60px; --side-w:264px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1216; --sheet:#171B20; --sheet-2:#1F242A; --sunk:#0B0E11;
  --ink:#E6E8EA; --ink-2:#AEB4BA; --ink-3:#80878E; --rule:#272D34; --rule-2:#3A424B;
  --indigo:#8E9BFF; --indigo-2:#AAB4FF; --indigo-soft:#222A52; --on-indigo:#0C1030;
  --moss:#62C49C; --moss-soft:#173327;
  --amber:#E7AA4A; --amber-soft:#382A11;
  --rust:#F08473; --rust-soft:#3B1E1A;
  --seal:#C4523F; --seal-ink:#FFF7F3;
  --grid:rgba(142,155,255,.04);
  --h0:#1E2329; --h1:#283063; --h2:#3B48A0; --h3:#5F70DB; --h4:#9CA8FF;
  --veil:rgba(0,0,0,.6);
  --shadow:0 1px 0 rgba(0,0,0,.35),0 16px 36px -18px rgba(0,0,0,.85);
  --page-shadow:0 0 0 1px rgba(255,255,255,.03),0 20px 44px -28px rgba(0,0,0,.9);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0F1216; --sheet:#171B20; --sheet-2:#1F242A; --sunk:#0B0E11;
  --ink:#E6E8EA; --ink-2:#AEB4BA; --ink-3:#80878E; --rule:#272D34; --rule-2:#3A424B;
  --indigo:#8E9BFF; --indigo-2:#AAB4FF; --indigo-soft:#222A52; --on-indigo:#0C1030;
  --moss:#62C49C; --moss-soft:#173327;
  --amber:#E7AA4A; --amber-soft:#382A11;
  --rust:#F08473; --rust-soft:#3B1E1A;
  --seal:#C4523F; --seal-ink:#FFF7F3;
  --grid:rgba(142,155,255,.04);
  --h0:#1E2329; --h1:#283063; --h2:#3B48A0; --h3:#5F70DB; --h4:#9CA8FF;
  --veil:rgba(0,0,0,.6);
  --shadow:0 1px 0 rgba(0,0,0,.35),0 16px 36px -18px rgba(0,0,0,.85);
  --page-shadow:0 0 0 1px rgba(255,255,255,.03),0 20px 44px -28px rgba(0,0,0,.9);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background-color:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--paper)}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink)}
a{color:var(--indigo)}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px;border-radius:6px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.fill{fill:currentColor;stroke:none}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.sp{flex:1}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100%}
.side{display:none}
.main{min-width:0;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);display:flex;align-items:center;gap:6px;height:52px;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));border-bottom:1px solid transparent}
.topbar.scrolled{border-bottom-color:var(--rule)}
.topbar .tb-title{flex:1;min-width:0;font-weight:600;font-size:16px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .15s}
.topbar.scrolled .tb-title{opacity:1}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);position:relative;flex:none}
.ib:hover{background:var(--sheet-2)}
.ib .sdot{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;border:2px solid var(--paper);background:var(--ink-3)}
.sdot.ok{background:var(--moss)} .sdot.saving{background:var(--amber)} .sdot.err{background:var(--rust)} .sdot.demo{background:var(--indigo)}
.page{max-width:760px;margin:0 auto;padding:6px max(16px,env(safe-area-inset-left,0px)) calc(var(--tab-h) + 110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));container-type:inline-size}
.page.wide{max-width:1120px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--sheet);border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(4,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.tab{height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--ink-3);position:relative}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--indigo);font-weight:600}
.tab .dot{position:absolute;top:8px;left:calc(50% + 7px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--indigo);color:var(--on-indigo);font-size:10px;font-family:var(--f-mono);display:grid;place-items:center;font-weight:600}
.fab{position:fixed;z-index:30;right:max(18px,calc(env(safe-area-inset-right,0px) + 14px));bottom:calc(var(--tab-h) + 16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;
  background:var(--indigo);color:var(--on-indigo);display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(50,67,176,.55),0 2px 6px rgba(0,0,0,.12)}
.fab svg{width:26px;height:26px;stroke-width:2.2}
.fab:active{transform:scale(.96)}
@media (min-width:800px){
  .app{grid-template-columns:var(--side-w) minmax(0,1fr)}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;background:var(--sheet);border-right:1px solid var(--rule);
    padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
  .tabbar,.topbar{display:none}
  .main{padding:22px 24px 0}
  .page{background:var(--sheet);border-radius:18px;box-shadow:var(--page-shadow);padding:26px 32px 120px;min-height:calc(100vh - 44px);min-height:calc(100dvh - 44px)}
  .fab{bottom:calc(26px + env(safe-area-inset-bottom,0px));right:max(30px,calc(env(safe-area-inset-right,0px) + 24px))}
}
/* sidebar */
.brand{display:flex;align-items:baseline;gap:8px;padding:4px 8px 12px}
.brand b{font-family:var(--f-disp);font-weight:800;font-size:21px;letter-spacing:.04em}
.brand span{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.06em}
.search-btn{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:10px;background:var(--sheet-2);color:var(--ink-3);font-size:14px;margin:0 0 10px;width:100%}
.search-btn svg{width:17px;height:17px}
.sgroup{display:flex;flex-direction:column;gap:1px;margin-bottom:14px}
.slabel{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink-3);padding:4px 10px;display:flex;align-items:center;gap:6px}
.slabel button{margin-left:auto;color:var(--ink-3);width:22px;height:22px;border-radius:6px;display:grid;place-items:center}
.slabel button svg{width:15px;height:15px}
.slabel button:hover{background:var(--sheet-2);color:var(--indigo)}
.sitem{display:flex;align-items:center;gap:10px;min-height:36px;padding:4px 10px;border-radius:9px;font-size:14.5px;color:var(--ink);text-align:left;width:100%;min-width:0}
.sitem svg{width:19px;height:19px;color:var(--indigo)}
.sitem:hover{background:var(--sheet-2)}
.sitem.on{background:var(--indigo-soft);color:var(--indigo);font-weight:600}
.sitem .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sitem .n{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.sitem.on .n{color:var(--indigo)}
.sitem.sub{padding-left:38px;font-size:14px;min-height:32px}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:8px;padding:8px 4px 0;border-top:1px solid var(--rule)}
.me-btn{display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding:6px;border-radius:10px;text-align:left}
.me-btn:hover{background:var(--sheet-2)}
.me-btn .who{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.me-btn .who b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-btn .who span{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:5px}
.me-btn .who span i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.me-btn .who span i.ok{background:var(--moss)} .me-btn .who span i.saving{background:var(--amber)} .me-btn .who span i.err{background:var(--rust)} .me-btn .who span i.demo{background:var(--indigo)}

/* glyphs, rings, avatars */
.glyph{width:22px;height:22px;border-radius:6px;background:var(--seal);color:var(--seal-ink);font-family:var(--f-disp);font-weight:800;font-size:13px;line-height:1;display:grid;place-items:center;flex:none}
.glyph.lg{width:34px;height:34px;border-radius:9px;font-size:20px}
.pring{width:18px;height:18px;flex:none}
.pring circle{fill:none;stroke-width:2.4}
.pring .bg{stroke:var(--rule-2)} .pring .fg{stroke:var(--indigo)}
.pring.lg{width:30px;height:30px}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11.5px;font-weight:700;flex:none;line-height:1}
.av.sm{width:20px;height:20px;font-size:10.5px}
.av.lg{width:40px;height:40px;font-size:16px}
.av.ghost{background:transparent!important;border:1.5px dashed var(--rule-2);color:var(--ink-3)}

/* page header */
.ph{display:flex;align-items:center;gap:12px;margin:6px 0 4px;min-width:0}
.ph .pico{width:30px;height:30px;color:var(--indigo);display:grid;place-items:center;flex:none}
.ph .pico svg{width:28px;height:28px;stroke-width:1.7}
.ph h1{font-family:var(--f-disp);font-weight:800;font-size:28px;line-height:1.2;margin:0;letter-spacing:.02em;min-width:0;overflow-wrap:anywhere}
.ph .ph-act{margin-left:auto;display:flex;gap:6px;flex:none}
.psub{color:var(--ink-3);font-size:13px;font-family:var(--f-mono);margin:0 0 18px 42px}
.psub.np{margin-left:0}
.pnote{color:var(--ink-2);font-size:14px;margin:-8px 0 18px 42px;max-width:62ch;line-height:1.65}

/* sections */
.sec{margin:22px 0 4px}
.sec:first-of-type{margin-top:8px}
.sh{display:flex;align-items:center;gap:8px;padding:0 4px 6px;border-bottom:1px solid var(--rule);margin-bottom:4px}
.sh h2{font-family:var(--f-disp);font-weight:600;font-size:15.5px;margin:0;display:flex;align-items:center;gap:8px;min-width:0}
.sh h2 svg{width:17px;height:17px;color:var(--indigo)}
.sh .n{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.sh .act{margin-left:auto;display:flex;gap:6px;align-items:center}
.link{color:var(--indigo);font-size:13.5px}
.why{font-size:11.5px;color:var(--indigo);font-family:var(--f-mono);padding:1px 6px;border-radius:6px;border:1px solid var(--indigo-soft);white-space:nowrap;vertical-align:1px}
.why:hover{background:var(--indigo-soft)}
.empty{padding:26px 6px;color:var(--ink-3);font-size:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;line-height:1.6}
.empty b{color:var(--ink-2);font-weight:600}

/* task rows */
.trow{display:flex;align-items:flex-start;gap:12px;padding:9px 6px;border-radius:10px;cursor:pointer;min-width:0;position:relative}
.trow:hover{background:color-mix(in srgb,var(--sheet-2) 70%,transparent)}
.ck{width:21px;height:21px;border-radius:50%;border:1.7px solid var(--rule-2);flex:none;margin-top:1px;display:grid;place-items:center;background:transparent;position:relative}
.ck::after{content:"";width:10px;height:6px;border-left:2.2px solid var(--on-indigo);border-bottom:2.2px solid var(--on-indigo);transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.ck:hover{border-color:var(--indigo)}
.ck.on{background:var(--indigo);border-color:var(--indigo)}
.ck.on::after{opacity:1}
.ck.hb{border-radius:7px}
.ck.hb.on{background:var(--moss);border-color:var(--moss)}
.ck.hb.on::after{border-color:var(--sheet)}
.ck.hb.half{border-color:var(--moss);background:linear-gradient(135deg,var(--moss) 50%,transparent 50%)}
.ck.ghost{border-style:dashed;cursor:default}
.ck.sm{width:18px;height:18px}
.ck.sm::after{width:8px;height:5px}
.tmain{flex:1;min-width:0}
.ttl{font-size:16px;line-height:1.4;overflow-wrap:anywhere}
.trow.done .ttl{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--rule-2)}
.tstar{color:var(--amber);display:inline-flex;vertical-align:-2px;margin-right:4px}
.tstar svg{width:15px;height:15px}
.tmeta{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;margin-top:2px;font-size:12.5px;color:var(--ink-3);min-width:0}
.tmeta>span{display:inline-flex;align-items:center;gap:4px;min-width:0;max-width:100%}
.tmeta svg{width:13px;height:13px}
.tmeta .nx{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:28ch}
.tmeta .dl{color:var(--amber)}
.tmeta .dl.late{color:var(--rust)}
.tmeta .wh .glyph{width:15px;height:15px;font-size:9.5px;border-radius:4px}
.tplay{width:32px;height:32px;border-radius:9px;color:var(--indigo);display:grid;place-items:center;flex:none;margin:-4px -2px -4px 0}
.tplay svg{width:15px;height:15px}
.tplay:hover{background:var(--indigo-soft)}
.trow .av{margin-top:-1px}

/* inline editor */
.editor{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px 10px;margin:8px -4px 12px;position:relative;z-index:2}
.ed-top{display:flex;gap:12px;align-items:flex-start}
.ed-title{flex:1;min-width:0;border:0;background:transparent;font-size:18px;font-weight:600;padding:0;outline:none;line-height:1.35}
.ed-notes{display:block;width:100%;border:0;background:transparent;resize:none;outline:none;padding:6px 0 4px 33px;font-size:15px;line-height:1.55;color:var(--ink-2);min-height:28px}
.ed-check{padding:2px 0 4px 33px;display:flex;flex-direction:column}
.ckl{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--rule);min-width:0}
.ckl span{flex:1;min-width:0;font-size:14.5px;overflow-wrap:anywhere}
.ckl.d span{color:var(--ink-3);text-decoration:line-through}
.ckl .x{color:var(--ink-3);width:28px;height:28px;display:grid;place-items:center;border-radius:7px;flex:none}
.ckl .x svg{width:14px;height:14px}
.ckl-add{display:flex;align-items:center;gap:10px;padding:5px 0}
.ckl-add input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:14.5px;padding:2px 0}
.ed-more{display:flex;flex-direction:column;gap:10px;padding:8px 0 4px 33px}
.ed-more label{font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.ed-more input{width:100%;border:0;border-bottom:1px solid var(--rule);background:transparent;outline:none;padding:4px 0;font-size:15px}
.ed-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 0 0 33px}
.pill{height:30px;padding:0 10px;border-radius:8px;background:var(--sheet-2);font-size:13px;display:inline-flex;gap:6px;align-items:center;color:var(--ink-2);max-width:100%;min-width:0}
.pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pill svg{width:15px;height:15px}
.pill.blank{background:transparent;border:1px dashed var(--rule-2);color:var(--ink-3)}
.pill.on{background:var(--indigo-soft);color:var(--indigo)}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
.pill.ico{width:30px;padding:0;justify-content:center}
.pill.ico.on svg.fill{color:var(--amber)}
.ed-bar .btn{margin-left:auto}

/* menus */
.menu{position:fixed;z-index:85;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);padding:6px;min-width:220px;max-width:min(320px,calc(100vw - 16px));max-height:min(70vh,520px);overflow:auto;animation:pop .14s ease}
.menu.dock{left:8px!important;right:8px;top:auto!important;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-width:none;border-radius:18px;padding:8px}
.mi{display:flex;gap:10px;align-items:center;width:100%;padding:9px 10px;border-radius:9px;text-align:left;font-size:14.5px;min-width:0}
.mi svg{width:17px;height:17px;color:var(--ink-3)}
.mi .glyph{width:18px;height:18px;font-size:11px;border-radius:5px}
.mi .r{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.mi span.t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi:hover{background:var(--sheet-2)}
.mi.on{color:var(--indigo);font-weight:600}
.mi.on svg{color:var(--indigo)}
.mi.sub{padding-left:36px}
.mh{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink-3);padding:8px 10px 4px}
.msep{height:1px;background:var(--rule);margin:4px 6px}
.mrow{display:flex;gap:6px;padding:6px 6px 4px}
.mrow input{flex:1;min-width:0;height:38px;border-radius:9px;border:1px solid var(--rule-2);background:var(--sheet);padding:0 10px}

/* rituals */
.ritual{border:1px solid var(--rule);border-radius:16px;padding:14px 16px;margin:10px 0 6px;background:var(--sheet);position:relative}
@media (min-width:800px){.ritual{background:var(--paper)}}
.ritual .rh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ritual .rh b{font-family:var(--f-disp);font-weight:600;font-size:16px}
.ritual .rh .eyebrow{margin-left:auto}
.ritual .q{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.ritual .q label{font-size:13px;color:var(--ink-2)}
.ritual .q input,.ritual .q textarea{width:100%;border:0;border-bottom:1px solid var(--rule-2);background:transparent;padding:6px 0;outline:none;font-size:15.5px;resize:none;line-height:1.5}
.ritual .q input:focus,.ritual .q textarea:focus{border-bottom-color:var(--indigo)}
.ritual .foot{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.ritual .note{font-size:12.5px;color:var(--ink-3)}
.intent{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;margin:8px 0 6px;border-left:3px solid var(--indigo);background:var(--indigo-soft);border-radius:0 12px 12px 0;cursor:pointer}
.intent .t{flex:1;min-width:0}
.intent .t b{display:block;font-size:15.5px;font-weight:600}
.intent .t span{display:block;font-size:13px;color:var(--ink-2)}
.feel{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.feel button{height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--rule);font-size:13.5px;color:var(--ink-2)}
.feel button.on{border-color:var(--indigo);background:var(--indigo-soft);color:var(--indigo);font-weight:600}
.hchips{display:flex;flex-direction:column}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 15px;border-radius:11px;background:var(--sheet-2);color:var(--ink);font-weight:500;font-size:14.5px;white-space:nowrap;border:1px solid transparent}
.btn:hover{border-color:var(--rule-2)}
.btn.pri{background:var(--indigo);color:var(--on-indigo)}
.btn.pri:hover{background:var(--indigo-2)}
.btn.line{background:transparent;border-color:var(--rule-2)}
.btn.sm{height:32px;padding:0 12px;font-size:13.5px;border-radius:9px}
.btn.danger{color:var(--rust)}
.btn.danger.armed{background:var(--rust);color:#fff}
.btn[disabled]{opacity:.45;cursor:default}
.btn svg{width:17px;height:17px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--sheet-2);border-radius:11px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{height:32px;padding:0 14px;border-radius:9px;font-size:14px;color:var(--ink-2);white-space:nowrap}
.seg button.on{background:var(--sheet);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.fchip{height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--rule);font-size:13px;color:var(--ink-2);white-space:nowrap}
.fchip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;background:var(--sheet-2);color:var(--ink-2);font-size:12px;font-family:var(--f-mono);white-space:nowrap}
.chip.ok{background:var(--moss-soft);color:var(--moss)} .chip.ind{background:var(--indigo-soft);color:var(--indigo)} .chip.warn{background:var(--rust-soft);color:var(--rust)}

/* lists home (phone) */
.lgroup{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;overflow:hidden;margin:10px 0 16px}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--rule);width:100%;text-align:left;min-width:0}
.lrow:first-child{border-top:0}
.lrow svg{color:var(--indigo)}
.lrow .lbl{flex:1;min-width:0;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .n{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-3)}
.lrow.sub{padding-left:48px}
.lrow:hover{background:var(--sheet-2)}
.lhead{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--ink-3);padding:0 6px;display:flex;align-items:center}
.lhead button{margin-left:auto}

/* project/area cards */
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin:6px 0}
.pcard{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--rule);border-radius:12px;text-align:left;min-width:0;background:transparent}
.pcard:hover{border-color:var(--indigo)}
.pcard .t{flex:1;min-width:0}
.pcard .t b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .t span{display:block;font-size:12px;color:var(--ink-3);font-family:var(--f-mono)}

/* habits */
.hrow{display:flex;align-items:flex-start;gap:12px;padding:9px 6px;border-radius:10px;min-width:0}
.hrow .tmain{cursor:pointer}
.mini-btn{height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--rule);font-size:12px;color:var(--ink-2);flex:none;white-space:nowrap}
.mini-btn.on{border-color:var(--moss);color:var(--moss);background:var(--moss-soft)}
.hprog{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:12px;color:var(--ink-3)}
.hprog .track{flex:1;max-width:150px;height:4px;border-radius:2px;background:var(--sunk);position:relative}
.hprog .track i{position:absolute;left:0;top:0;bottom:0;background:var(--moss);border-radius:2px}
.note-amber{color:var(--amber);font-size:12.5px;margin-top:3px}
.hcard{padding:12px 6px;border-top:1px solid var(--rule);display:flex;gap:14px;align-items:flex-start;cursor:pointer;border-radius:0}
.hcard:first-child{border-top:0}
.plan-s{font-size:14.5px;line-height:1.6}
.plan-s em{font-style:normal;background:var(--moss-soft);color:var(--moss);padding:1px 5px;border-radius:5px}
.hstats{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:12.5px;color:var(--ink-2)}
.hstats b{font-family:var(--f-mono);font-weight:600;color:var(--ink)}
.tpl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.tpl button{text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--rule);display:flex;flex-direction:column;gap:2px;min-width:0}
.tpl button:hover{border-color:var(--moss)}
.tpl .c{font-size:12px;color:var(--ink-3);font-family:var(--f-mono)}
.tpl .b{font-size:14.5px}
.spark{width:92px;height:30px;display:block;flex:none}
.spark .ln{stroke:var(--moss);stroke-width:1.8;fill:none}
.spark .ar{fill:var(--moss-soft);stroke:none}
.spark .pt{fill:var(--moss);stroke:var(--sheet);stroke-width:1.5}
.spark .gd{stroke:var(--rule);stroke-width:1;stroke-dasharray:2 3}

/* panels (tools) */
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);min-width:0}
@media (min-width:800px){.page .panel{background:var(--paper)}.page .panel .panel{background:var(--sheet)}}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.panel-h h2{font-family:var(--f-disp);font-weight:600;font-size:16.5px;margin:0;line-height:1.3}
.panel-h .eyebrow{margin-left:auto}
.panel-b{padding:0 16px 16px}
.cols{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@container (min-width:720px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.callout{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r);background:var(--indigo-soft);min-width:0}
.callout.amber{background:var(--amber-soft)} .callout.red{background:var(--rust-soft)} .callout.moss{background:var(--moss-soft)}
.callout .grow{flex:1;min-width:0}
.callout h3{margin:0 0 3px;font-size:15px;font-weight:600}
.callout p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.6}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--rule)}
.kv>div{padding:12px 14px;border-left:1px solid var(--rule);min-width:0}
.kv>div:first-child{border-left:0}
.kv .v{font-family:var(--f-disp);font-weight:800;font-size:22px;line-height:1.2}
.kv .v small{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3);font-weight:400;margin-left:2px}
@media (max-width:480px){.kv{grid-template-columns:repeat(2,minmax(0,1fr))}.kv>div:nth-child(3){border-left:0}.kv>div:nth-child(n+3){border-top:1px solid var(--rule)}}

/* focus */
.focus-hero{display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px 16px 18px}
.ring{position:relative;width:min(260px,72vw);aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);stroke-width:1}
.ring .bg{stroke:var(--sunk);stroke-width:10;fill:none}
.ring .fg{stroke:var(--indigo);stroke-width:10;fill:none;stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.ring.brk .fg{stroke:var(--moss)}
.ring .tk{stroke:var(--rule-2);stroke-width:1.2}
.ring .tk.l{stroke:var(--ink-3);stroke-width:1.6}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ring-phase{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--ink-3)}
.ring-time{font-family:var(--f-mono);font-size:clamp(42px,12vw,58px);font-weight:500;line-height:1.05;letter-spacing:-.02em}
.ring-meta{font-size:13px;color:var(--ink-2);max-width:78%;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctrl{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.big-btn{height:52px;min-width:150px;border-radius:16px;font-size:17px}
.presets{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.presets button{height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--rule);font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2)}
.presets button.on{border-color:var(--indigo);color:var(--indigo);background:var(--indigo-soft)}
.preflight{display:flex;flex-wrap:wrap;gap:8px}
.pf{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--rule);font-size:13.5px;color:var(--ink-2)}
.pf i{width:16px;height:16px;border-radius:5px;border:1.6px solid var(--rule-2);flex:none}
.pf.on{border-color:var(--moss);color:var(--ink)}
.pf.on i{background:var(--moss);border-color:var(--moss)}
.brk-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.brk-list li{padding:10px 12px;border-radius:10px;background:var(--moss-soft);font-size:13.5px}
.sess{display:flex;gap:12px;align-items:baseline;padding:9px 16px;border-top:1px solid var(--rule);font-size:13.5px}
.sess:first-child{border-top:0}
.sess .mono{color:var(--ink-3);width:44px;flex:none}
.sess .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* fields */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.flabel{font-size:13px;color:var(--ink-2);font-weight:500;display:flex;align-items:center;gap:8px}
.field .hint{font-size:12px;color:var(--ink-3);line-height:1.5}
.inp{width:100%;min-width:0;height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--rule-2);background:var(--sheet)}
textarea.inp{height:auto;min-height:76px;padding:10px 12px;resize:vertical;line-height:1.5}
.inp:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px var(--indigo-soft)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.inline{display:flex;gap:8px;min-width:0}
.inline .inp{flex:1}
.choice{display:flex;gap:6px;flex-wrap:wrap}
.choice button{height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--rule);font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.choice button.on{border-color:var(--indigo);background:var(--indigo-soft);color:var(--indigo);font-weight:600}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.days button{height:38px;border-radius:9px;border:1px solid var(--rule);font-size:14px;color:var(--ink-2)}
.days button.on{background:var(--moss);border-color:var(--moss);color:var(--sheet);font-weight:600}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--rule-2);border-radius:10px;overflow:hidden;height:42px}
.stepper button{width:42px;height:100%;font-size:20px;color:var(--ink-2)}
.stepper output{min-width:46px;text-align:center;font-family:var(--f-mono);font-size:16px}
.lrow2{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.toggle{width:46px;height:28px;border-radius:14px;background:var(--rule-2);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--sheet);transition:transform .15s}
.toggle.on{background:var(--moss)}
.toggle.on::after{transform:translateX(18px)}
.preview{border-left:3px solid var(--moss);padding:8px 12px;background:var(--moss-soft);border-radius:0 10px 10px 0;font-size:14.5px;line-height:1.65}
.scale{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.scale button{height:36px;border-radius:8px;border:1px solid var(--rule);font-family:var(--f-mono);font-size:13.5px;color:var(--ink-2)}
.scale button.on{background:var(--indigo);border-color:var(--indigo);color:var(--on-indigo)}
.srb-item{display:flex;flex-direction:column;gap:6px}
.srb-item p{margin:0;font-size:14px}
.tactic{border-radius:12px;background:var(--sheet-2);padding:14px;display:flex;flex-direction:column;gap:6px}
.tactic h3{margin:0;font-size:16px;font-weight:600}
.tactic p{margin:0;font-size:14px;line-height:1.65;color:var(--ink-2)}
.feelgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.feelgrid button{min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--rule);text-align:left;font-size:14.5px}
.feelgrid button.on{border-color:var(--indigo);background:var(--indigo-soft);color:var(--indigo);font-weight:600}
.mini-cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mini-cal .hd{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);text-align:center}
.mini-cal button{aspect-ratio:1/1;max-width:100%;border-radius:7px;border:1px solid var(--rule);font-family:var(--f-mono);font-size:11px;color:var(--ink-3);min-width:0}
.mini-cal button.done{background:var(--moss);border-color:var(--moss);color:var(--sheet)}
.mini-cal button.half{background:linear-gradient(135deg,var(--moss) 50%,var(--sheet) 50%);border-color:var(--moss);color:var(--ink)}
.mini-cal button.miss{border-color:var(--rule-2);color:var(--ink-2)}
.mini-cal button.off{border-style:dashed;opacity:.5}
.mini-cal button.today{outline:2px solid var(--ink);outline-offset:1px}
.mini-cal span.blank{aspect-ratio:1/1}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:480px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{border:1px solid var(--rule);border-radius:12px;padding:10px 12px;min-width:0}
.tile .v{font-family:var(--f-disp);font-weight:800;font-size:22px;line-height:1.2}
.tile .v small{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);font-weight:400;margin-left:2px}
.meter{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--indigo);border-radius:2px}
.meter.moss i{background:var(--moss)}
.codebox{width:100%;min-height:110px;font-family:var(--f-mono);font-size:12px;word-break:break-all}
.auto-chart{width:100%;height:auto;display:block}
.auto-chart .ax{stroke:var(--rule-2);stroke-width:1}
.auto-chart .gd{stroke:var(--rule);stroke-dasharray:3 4}
.auto-chart text{fill:var(--ink-3);stroke:none;font-family:var(--f-mono);font-size:10px}
.auto-chart .ln{stroke:var(--moss);stroke-width:2;fill:none}
.auto-chart .ar{fill:var(--moss-soft);stroke:none}
.auto-chart .pt{fill:var(--moss);stroke:var(--sheet);stroke-width:2}

/* review cards */
.flash{padding:22px 20px;display:flex;flex-direction:column;gap:14px;min-height:300px}
.flash .q{font-family:var(--f-disp);font-weight:600;font-size:clamp(19px,4.8vw,24px);line-height:1.45;overflow-wrap:anywhere}
.flash .a{font-size:16px;line-height:1.65;border-top:1px dashed var(--rule-2);padding-top:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:auto}
.grades button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:12px;border:1px solid var(--rule);background:var(--sheet)}
.grades button b{font-size:14.5px;font-weight:600}
.grades button span{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
.grades .g0 b{color:var(--rust)} .grades .g3 b{color:var(--moss)}
.grades button:hover{border-color:var(--indigo)}
.progress-line{height:3px;background:var(--sunk);border-radius:2px;overflow:hidden}
.progress-line i{display:block;height:100%;background:var(--indigo)}
.crow{display:flex;gap:10px;padding:10px 6px;border-top:1px solid var(--rule);cursor:pointer;min-width:0}
.crow:first-child{border-top:0}
.crow:hover{background:var(--sheet-2)}

/* overview */
.ov-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ov-nav{display:flex;align-items:center;gap:4px;margin-left:auto}
.ov-nav .lab{font-family:var(--f-mono);font-size:13.5px;padding:0 6px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 14px 12px;min-width:0}
@media (min-width:800px){.kpi{background:var(--paper)}}
.kpi .v{font-family:var(--f-disp);font-weight:800;font-size:clamp(24px,6vw,30px);line-height:1.15;margin-top:4px}
.kpi .v small{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-3);font-weight:400;margin-left:3px}
.kpi .d{font-size:12px;font-family:var(--f-mono);color:var(--ink-3);margin-top:4px}
.kpi .d.up{color:var(--moss)} .kpi .d.down{color:var(--ink-2)}
.chart{padding:4px 16px 14px}
.bars{display:grid;grid-template-columns:34px repeat(var(--n),minmax(0,1fr));column-gap:6px}
.bars.compact,.bars.compact .plot{column-gap:2px}
.bars .plot{grid-column:2 / -1;position:relative;height:160px;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));column-gap:inherit;align-items:end;border-bottom:1px solid var(--rule-2)}
.bars .yax{grid-column:1;position:relative;height:160px}
.bars .yax span{position:absolute;right:2px;transform:translateY(50%);font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}
.bars .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--rule)}
.bcol{height:100%;display:flex;align-items:flex-end;justify-content:center;position:relative}
.bcol .b{width:min(100%,34px);background:var(--indigo);border-radius:4px 4px 0 0;position:relative}
.bars.compact .bcol .b{border-radius:2px 2px 0 0}
.bcol.today .b{background:var(--indigo-2)}
.bcol .val{position:absolute;left:0;right:0;text-align:center;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2);padding-bottom:3px}
.bars .xl,.bars .rl,.bars .rv{font-size:11.5px;text-align:center;padding-top:6px;min-width:0}
.bars .xl{font-family:var(--f-mono);color:var(--ink-2)}
.bars .xl.today{color:var(--indigo);font-weight:600}
.bars .rl{text-align:right;font-size:10.5px;color:var(--ink-3);padding-right:2px;white-space:nowrap;font-family:var(--f-mono);border-top:1px solid var(--rule);padding-block:6px}
.bars .rv{font-family:var(--f-mono);color:var(--ink);border-top:1px solid var(--rule);padding-block:6px}
.bars .rv.z{color:var(--ink-3)}
.hgrid{display:grid;grid-template-columns:minmax(90px,1.6fr) repeat(var(--n),minmax(0,1fr));align-items:center;row-gap:2px;column-gap:4px;padding:0 16px 8px}
.hgrid .hn{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:6px}
.hgrid .hh{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);text-align:center;padding-bottom:4px}
.hgrid .hh.today{color:var(--indigo);font-weight:600}
.hgrid .c{height:30px;display:grid;place-items:center}
.gl-done,.gl-half,.gl-miss,.gl-fut,.gl-off{width:16px;height:16px;border-radius:5px;display:inline-block;vertical-align:middle}
.gl-done{background:var(--moss)}
.gl-half{border:2px solid var(--moss);background:linear-gradient(135deg,var(--moss) 50%,transparent 50%)}
.gl-miss{border:2px solid var(--rule-2)}
.gl-fut{border:1.5px dashed var(--rule-2)}
.gl-off{width:8px;height:2px;border-radius:1px;background:var(--rule)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-3);padding:4px 16px 14px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.heat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;padding:0 16px}
.heat .hd{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);text-align:center;padding-bottom:2px}
.cell{aspect-ratio:1/1;max-width:100%;border-radius:8px;background:var(--h0);position:relative;padding:5px 6px;font-family:var(--f-mono);font-size:11px;color:var(--ink-2);min-width:0}
.cell.l1{background:var(--h1)} .cell.l2{background:var(--h2)} .cell.l3{background:var(--h3);color:var(--on-indigo)} .cell.l4{background:var(--h4);color:var(--on-indigo)}
.cell.na{background:transparent;border:1px dashed var(--rule)}
.cell.fut{background:transparent;border:1px solid var(--rule);color:var(--ink-3)}
.cell.today{outline:2px solid var(--ink);outline-offset:1px}
.cell.blank{background:transparent}
.cell .cv{position:absolute;right:6px;bottom:4px;font-size:10px;opacity:.85}
@media (max-width:420px){.cell .cv{display:none}.cell{border-radius:6px;padding:3px 4px;font-size:10px}}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block}
.calib{display:flex;flex-direction:column;gap:10px;padding:0 16px 16px}
.calib .big{font-family:var(--f-disp);font-weight:800;font-size:30px;line-height:1.1}
.cb-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:10px;align-items:center;font-size:13px}
.cb-row .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb-bars{display:flex;flex-direction:column;gap:3px}
.cb-bars i{display:block;height:7px;border-radius:0 3px 3px 0}
.cb-bars .e{background:var(--rule-2)} .cb-bars .a{background:var(--indigo)}
.bal{display:flex;flex-direction:column;gap:2px;padding:0 16px 14px}
.bal-row{display:grid;grid-template-columns:22px minmax(0,4.5em) minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;font-size:13.5px}
.bal-row .bar{height:10px;border-radius:0 5px 5px 0;background:var(--sunk);position:relative;overflow:hidden}
.bal-row .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--indigo);border-radius:0 5px 5px 0}
.bal-row .num{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);white-space:nowrap}
.bal-row.zero .bar{background:repeating-linear-gradient(90deg,var(--rule) 0 4px,transparent 4px 8px)}
.hm-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(70px,1fr) 44px 92px;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--rule);font-size:13.5px}
.hm-row:first-child{border-top:0}
.hm-row .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hm-row .pct{font-family:var(--f-mono);text-align:right;font-size:12.5px}
.reflect{display:flex;flex-direction:column;gap:12px;padding:0 16px 16px}
.three{display:grid;gap:8px}
.jq{border-left:3px solid var(--seal);padding:6px 0 6px 12px;font-size:14.5px;line-height:1.6;color:var(--ink)}

/* group */
.member{display:flex;gap:12px;align-items:flex-start;padding:14px 6px;border-top:1px solid var(--rule);min-width:0}
.member:first-child{border-top:0}
.member .t{flex:1;min-width:0}
.member .t b{font-weight:600;font-size:15.5px}
.member .stats{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:12.5px;color:var(--ink-2);margin-top:4px}
.member .stats b{font-family:var(--f-mono);font-size:12.5px}
.wkdots{display:flex;gap:4px;margin-top:8px}
.wkdots i{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--rule-2);display:block}
.wkdots i.on{background:var(--moss);border-color:var(--moss)}
.wkdots i.fut{border-style:dashed;opacity:.6}
.cheer{height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--rule-2);font-size:13px;color:var(--ink-2);white-space:nowrap;flex:none}
.cheer.done{border-color:var(--moss);color:var(--moss);background:var(--moss-soft)}

/* library */
.lib-intro{max-width:68ch;color:var(--ink-2);font-size:14.5px;margin:0 0 12px}
.lib{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);margin-top:12px}
@container (min-width:720px){.lib{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.entry{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
@media (min-width:800px){.page .entry{background:var(--paper)}}
.entry h3{font-family:var(--f-disp);font-weight:600;font-size:18px;margin:0;line-height:1.35;text-wrap:balance}
.entry .top-l{display:flex;align-items:center;gap:10px;justify-content:space-between}
.entry p{margin:0;font-size:14px;line-height:1.7;max-width:68ch}
.entry .modern{font-size:13px;color:var(--ink-2);border-left:3px solid var(--rule-2);padding-left:10px}
.entry .use{background:var(--indigo-soft);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.6}
.entry .use b{font-weight:600;color:var(--indigo);margin-right:4px}
.refs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink-2)}
.refs li{overflow-wrap:anywhere;line-height:1.5}
.refs a{font-family:var(--f-mono);font-size:11.5px}
.ev{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.ev i{width:5px;height:12px;border-radius:1.5px;background:var(--rule)}
.ev i.on{background:var(--ink-2)}
.ev.s3 i.on{background:var(--moss)}
.ev.trad{color:var(--seal)}
.ev.trad::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--seal)}

.sheet-bg{position:fixed;inset:0;z-index:60;background:var(--veil);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet-bg.l2{z-index:70}
.sheet{background:var(--sheet);width:100%;max-height:calc(100% - 28px - env(safe-area-inset-top,0px));border-radius:20px 20px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:up .22s cubic-bezier(.2,.8,.2,1)}
@media (min-width:700px){.sheet-bg{align-items:center;padding:24px}.sheet{width:min(600px,100%);max-height:min(860px,calc(100% - 48px));border-radius:20px}.sheet.wide{width:min(760px,100%)}}
.sh-h2{display:flex;align-items:center;gap:10px;padding:16px 16px 12px 20px;border-bottom:1px solid var(--rule)}
.sh-h2 h2{margin:0;font-family:var(--f-disp);font-weight:600;font-size:19px;flex:1;min-width:0}
.sh-b{min-height:0;padding:16px 20px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sh-f{display:flex;gap:10px;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule);flex-wrap:wrap;align-items:center}
@media (min-width:700px){.sh-f{padding-bottom:14px}}
.choose{display:flex;flex-direction:column;gap:10px}
.choose button{display:flex;gap:14px;align-items:flex-start;text-align:left;padding:14px;border-radius:14px;border:1px solid var(--rule);min-width:0}
.choose button:hover{border-color:var(--indigo)}
.choose button .ci{width:38px;height:38px;border-radius:11px;background:var(--indigo-soft);color:var(--indigo);display:grid;place-items:center;flex:none}
.choose button b{display:block;font-size:15.5px;font-weight:600}
.choose button span{display:block;font-size:13px;color:var(--ink-2);margin-top:2px;line-height:1.5}
.sres{display:flex;flex-direction:column}
.sres .rh{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink-3);padding:10px 4px 4px}
.sres button{display:flex;gap:10px;align-items:center;padding:9px 6px;border-radius:9px;text-align:left;min-width:0}
.sres button:hover{background:var(--sheet-2)}
.sres button span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sres button svg{width:16px;height:16px;color:var(--ink-3)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 86px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 14px;font-size:14px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);max-width:min(92vw,520px);animation:toastIn .2s ease}
#toast button{color:var(--h2);font-weight:600;white-space:nowrap}
@media (min-width:800px){#toast{bottom:28px}}
#tip{position:fixed;z-index:95;background:var(--ink);color:var(--paper);font-size:12px;line-height:1.5;padding:7px 10px;border-radius:8px;pointer-events:none;white-space:pre-line;max-width:240px;font-family:var(--f-mono)}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px;background:var(--indigo-soft);border-radius:12px;padding:10px 12px;margin:6px 0 12px}
.banner.err{background:var(--rust-soft)}
.banner b{font-weight:600}
@keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

function schedule(c, g, today) {
  let ivl = c.ivl || 0, ease = c.ease || 2.5, rp = c.reps || 0, lapses = c.lapses || 0;
  if (g === 0) { lapses++; rp = 0; ivl = 1; ease = Math.max(1.3, ease - 0.2); }
  else if (g === 1) { ivl = rp === 0 ? 1 : Math.max(ivl + 1, Math.round(ivl * 1.2)); ease = Math.max(1.3, ease - 0.15); rp++; }
  else if (g === 2) { ivl = rp === 0 ? 1 : rp === 1 ? 3 : Math.max(ivl + 1, Math.round(ivl * ease)); rp++; }
  else { ivl = rp === 0 ? 4 : rp === 1 ? 6 : Math.max(ivl + 1, Math.round(ivl * ease * 1.3)); ease = Math.min(3.2, ease + 0.15); rp++; }
  ivl = Math.min(ivl, 365);

/* ================= upgrades from earlier versions ================= */
function upgradeDoc(d) {
  d = clone(d); if (!d || !d.kind) return null;
  delete d.sp;
  if (d.kind === 'task') {
    if (!d.list) d.list = d.inbox ? 'inbox' : 'anytime';
    if (d.inbox && d.date) d.list = 'anytime';
    const cl = Array.isArray(d.checklist) ? d.checklist : [];
    if (Array.isArray(d.steps)) for (const s of d.steps) cl.push({ t: s.t, d: !!s.d });
    if (d.firstStep && !cl.some(c => c.t === d.firstStep)) cl.unshift({ t: d.firstStep, d: false });
    d.checklist = cl; delete d.steps; delete d.firstStep; delete d.inbox;
    if (!d.notes) d.notes = '';
  }
  return d;
}

    use: '默认 25 分钟专注 + 5 分钟休息，每 4 轮一次长休息，可在设置里调整。',
    refs: [["Biwer, F., Wiradhany, W., oude Egbrink, M. G. A., & de Bruin, A. B. H. (2023). Understanding effort regulation: Comparing 'Pomodoro' breaks and self-regulated breaks. British Journal of Educational Psychology, 93(S2), 353–367.", '10.1111/bjep.12593']] },
  { id: 'microbreak', cat: 'focus', lvl: 2, title: '微休息：恢复精力',
    find: 'Albulescu 等人的元分析显示，10 分钟以内的微休息能提升活力（d = 0.36）、减轻疲劳（d = 0.35）；对工作表现的总体效应小且不显著，主要帮到较轻松的任务，高强度任务可能需要更长的休息。',
    use: '休息时给你离开屏幕的建议；长休息默认 15 分钟。',
    refs: [['Albulescu, P., Macsinga, I., Rusu, A., Sulea, C., Bodnaru, A., & Tulbure, B. T. (2022). "Give me a break!" A systematic review and meta-analysis on the efficacy of micro-breaks for increasing well-being and performance. PLOS ONE, 17(8), e0272460.', '10.1371/journal.pone.0272460']] },
  { id: 'residue', cat: 'focus', lvl: 2, title: '注意力残留与「准备恢复计划」',
    find: 'Leroy 发现，事情没做完就切换，部分注意力会留在上一件事上，拖累下一件事。Leroy 与 Glomb 进一步发现，被打断时花一分钟写下「停在哪、还剩什么」，能减少残留，让新任务做得更好。',
    use: '提前结束一轮专注时，会请你写一句「下次从哪里继续」，存在这个任务上。',
    refs: [['Leroy, S. (2009). Why is it so hard to do my work? The challenge of attention residue when switching between work tasks. Organizational Behavior and Human Decision Processes, 109(2), 168–181.', '10.1016/j.obhdp.2009.04.002'],
      ['Leroy, S., & Glomb, T. M. (2018). Tasks interrupted: How anticipating time pressure on resumption of an interrupted task causes attention residue and low performance on interrupting tasks and how a "ready-to-resume" plan mitigates the effects. Organization Science, 29(3), 380–397.', '10.1287/orsc.2017.1184']] },
  { id: 'switch', cat: 'focus', lvl: 3, title: '切换任务有代价',
    find: 'Rubinstein、Meyer 与 Evans 的实验表明，在任务之间来回切换会损失时间，任务越复杂、越陌生，损失越大。',
    use: '每一轮专注只绑定一个任务。',
    refs: [['Rubinstein, J. S., Meyer, D. E., & Evans, J. E. (2001). Executive control of cognitive processes in task switching. Journal of Experimental Psychology: Human Perception and Performance, 27(4), 763–797.', '10.1037/0096-1523.27.4.763']] },
  { id: 'phone', cat: 'focus', lvl: 1, title: '把手机放到视线外',
    find: 'Ward 等人报告，即使手机静音扣着放，只要在身边就会降低可用的认知容量。有些重复研究没能复现；2023 年的一项元分析总体支持存在负面影响，但各研究差异很大。',
    use: '专注前的检查清单把「手机放到视线外」放在第一项，几乎没有成本。',
    refs: [["Ward, A. F., Duke, K., Gneezy, A., & Bos, M. W. (2017). Brain drain: The mere presence of one's own smartphone reduces available cognitive capacity. Journal of the Association for Consumer Research, 2(2), 140–154.", '10.1086/691462'],
      ['Böttger, T., Poschik, M., & Zierer, K. (2023). Does the brain drain effect really exist? A meta-analysis. Behavioral Sciences, 13(9), 751.', '10.3390/bs13090751']] },
  { id: 'phonebreak', cat: 'focus', lvl: 1, title: '休息时别刷手机',
    find: 'Kang 与 Kurtzberg 的实验中，用手机休息的人回到任务后，解题效率更低、解出的题更少，不如用其他方式休息的人。',
    use: '休息建议都是离开屏幕的活动。',
    refs: [['Kang, S., & Kurtzberg, T. R. (2019). Reach for your cell phone at your own risk: The cognitive costs of media choice for breaks. Journal of Behavioral Addictions, 8(3), 395–403.', '10.1556/2006.8.2019.21']] },
  // ---- 习惯养成 ----
  { id: 'habit66', cat: 'habit', lvl: 2, title: '一个习惯要多久？',
    find: 'Lally 等人追踪 96 人，自动化程度达到平台期的中位时间是 66 天，个体差异 18–254 天；偶尔漏做一次对整体进程影响不大。2024 年一项纳入 20 项研究的系统综述结论相近：中位数 59–66 天，范围 4–335 天。',
    use: '习惯进度以 66 次重复作参考；漏一次不清零，只提醒你「别连漏两次」。',
    refs: [['Lally, P., van Jaarsveld, C. H. M., Potts, H. W. W., & Wardle, J. (2010). How are habits formed: Modelling habit formation in the real world. European Journal of Social Psychology, 40(6), 998–1009.', '10.1002/ejsp.674'],
      ['Singh, B., Murphy, A., Maher, C., & Smith, A. E. (2024). Time to form a habit: A systematic review and meta-analysis of health behaviour habit formation and its determinants. Healthcare, 12(23), 2488.', '10.3390/healthcare12232488']] },
  { id: 'months', cat: 'habit', lvl: 3, title: '不同行为，养成时间差很多',
    find: 'Buyalskaya 等人用机器学习分析了 1200 多万次健身房签到和 4000 多万次医院洗手记录：健身习惯通常要几个月才形成，医院洗手习惯只要几周。并不存在一个适用于所有人的「魔法天数」；习惯越稳定的人，对额外奖励的反应越小。',
    use: '66 天只是参考线。运动这类费力的行为，给自己更长的时间。',
    refs: [['Buyalskaya, A., Ho, H., Milkman, K. L., Li, X., Duckworth, A. L., & Camerer, C. (2023). What can machine learning teach us about habit formation? Evidence from exercise and hygiene. Proceedings of the National Academy of Sciences, 120(17), e2216115120.', '10.1073/pnas.2216115120']] },
  { id: 'cues', cat: 'habit', lvl: 3, title: '习惯靠稳定的情境触发',
    find: '习惯是在稳定情境里反复做同一件事后形成的「情境—反应」联结：时间、地点或前一个动作会自动触发它，不再需要每次靠意志力。',
    use: '每个习惯都要绑定一个锚点（比如「早餐后」），再加上时段和地点。',
    refs: [['Wood, W., & Rünger, D. (2016). Psychology of habit. Annual Review of Psychology, 67, 289–314.', '10.1146/annurev-psych-122414-033417']] },
  { id: 'anchor', cat: 'habit', lvl: 1, title: '把新习惯接在旧习惯「之后」',
    find: 'Judah 等人让 50 人养成用牙线的习惯：被要求在刷牙之后用牙线的人，8 个月后习惯更强、用得也更频繁（4 周时只是趋势）。这是一项小规模的探索性研究。',
    use: '习惯模板都写成「在……之后」，把新行为接在一个已经很稳定的动作后面。',
    refs: [['Judah, G., Gardner, B., & Aunger, R. (2013). Forming a flossing habit: An exploratory study of the psychological determinants of habit formation. British Journal of Health Psychology, 18(2), 338–353.', '10.1111/j.2044-8287.2012.02086.x']] },
  { id: 'morning', cat: 'habit', lvl: 1, title: '早上开始的习惯可能形成得更快',
    find: 'Fournier 等人让 48 名学生每天做一个拉伸动作，一组在起床后、一组在睡前：按学习曲线推算，早上组约 106 天达到自动化，晚上组约 154 天，研究者认为与早晨皮质醇较高有关。样本小，仍需更多研究。',
    use: '新习惯的时段可以优先考虑早上。',
    refs: [["Fournier, M., d'Arripe-Longueville, F., Rovere, C., Easthope, C. S., Schwabe, L., El Methni, J., & Radel, R. (2017). Effects of circadian cortisol on the development of a health habit. Health Psychology.", '10.1037/hea0000510']] },
  { id: 'discont', cat: 'habit', lvl: 2, title: '生活转折是改习惯的窗口',
    find: 'Verplanken 与 Roy 对 800 人的实地实验发现，同样的环保行为干预，对最近搬过家的人效果更好；这个窗口期大约持续三个月。旧习惯依附的情境被打断时，新行为更容易扎根。',
    use: '搬家、换工作、开学、新年这类节点，是重新设定锚点和习惯的好时机。',
    refs: [['Verplanken, B., & Roy, D. (2016). Empowering interventions to promote sustainable lifestyles: Testing the habit discontinuity hypothesis in a field experiment. Journal of Environmental Psychology, 45, 127–134.', '10.1016/j.jenvp.2015.11.008']] },
  { id: 'immediate', cat: 'habit', lvl: 2, title: '让过程本身有点甜头',
    find: 'Woolley 与 Fishbach 的五项研究（涉及新年计划、学习、健身、吃蔬菜）发现：做的过程中马上能得到的乐趣，比遥远的长期回报更能预测人们会不会坚持；长期回报更多影响的是定目标。',
    use: '选你喜欢的方式去做（喜欢的运动、喜欢的书）；打卡时的小小反馈也是一种即时奖励。',
    refs: [['Woolley, K., & Fishbach, A. (2017). Immediate rewards predict adherence to long-term goals. Personality and Social Psychology Bulletin, 43(2), 151–162.', '10.1177/0146167216676480']] },
  { id: 'srbai', cat: 'habit', lvl: 2, title: '用「自动化程度」衡量习惯',
    find: 'Gardner 等人从习惯量表中提炼出 4 个条目（SRBAI），专门测「不假思索就去做」的程度，比单纯数天数更接近习惯的本质。',
    use: '每周花半分钟给每个习惯打分（1–7），回顾里会画出你的自动化曲线。',
    refs: [['Gardner, B., Abraham, C., Lally, P., & de Bruijn, G.-J. (2012). Towards parsimony in habit measurement: Testing the convergent and predictive validity of an automaticity subscale of the Self-Report Habit Index. International Journal of Behavioral Nutrition and Physical Activity, 9, 102.', '10.1186/1479-5868-9-102']] },
  { id: 'tiny', cat: 'habit', lvl: 2, title: '从一定能成功的小事开始',
    find: 'Bandura 的自我效能理论认为，亲身的成功经验是建立「我能做到」信念最有力的来源。',
    use: '每个习惯都有「迷你版本」，状态差时做迷你版也算数，保住情境和行为的连续重复。',
    refs: [['Bandura, A. (1977). Self-efficacy: Toward a unifying theory of behavioral change. Psychological Review, 84(2), 191–215.', '10.1037/0033-295X.84.2.191']] },
  // ---- 记忆与学习 ----
  { id: 'spacing', cat: 'mem', lvl: 3, title: '间隔效应：分开学，记得久',
    find: 'Cepeda 等人的元分析确认，分散学习优于集中学习。他们随后对 1,350 多人的实验发现，最佳复习间隔随想记住的时长而变长：想记一周，间隔约为这段时间的 20–40%；想记一年，约为 5–10%。',
    use: '复习卡片每答对一次，下一次间隔就拉长一些。',
    refs: [['Cepeda, N. J., Pashler, H., Vul, E., Wixted, J. T., & Rohrer, D. (2006). Distributed practice in verbal recall tasks: A review and quantitative synthesis. Psychological Bulletin, 132(3), 354–380.', '10.1037/0033-2909.132.3.354'],
      ['Cepeda, N. J., Vul, E., Rohrer, D., Wixted, J. T., & Pashler, H. (2008). Spacing effects in learning: A temporal ridgeline of optimal retention. Psychological Science, 19(11), 1095–1102.', '10.1111/j.1467-9280.2008.02209.x']] },
  { id: 'retrieval', cat: 'mem', lvl: 3, title: '提取练习：先回忆，再看答案',
    find: 'Roediger 与 Karpicke 发现，学完后做回忆测试的人，一周后记住的比反复重读的人更多，尽管重读当时让人觉得记得更牢。',
    use: '复习时先在心里作答，再翻看答案，并诚实地给自己打分。',
    refs: [['Roediger, H. L., & Karpicke, J. D. (2006). Test-enhanced learning: Taking memory tests improves long-term retention. Psychological Science, 17(3), 249–255.', '10.1111/j.1467-9280.2006.01693.x']] },
  { id: 'relearn', cat: 'mem', lvl: 3, title: '答错了，再提取一次',
    find: 'Karpicke 与 Roediger 发表在《Science》上的研究显示，长期记忆的关键是反复成功地提取，而不是反复地学。',
    use: '本轮选了「忘了」的卡片，会在本轮最后再出现一次。',
    refs: [['Karpicke, J. D., & Roediger, H. L. (2008). The critical importance of retrieval for learning. Science, 319(5865), 966–968.', '10.1126/science.1152408']] },
  { id: 'dunlosky', cat: 'mem', lvl: 3, title: '哪些学习方法真的有用',
    find: 'Dunlosky 等人评估了 10 种常见学习方法：练习测试和分散练习效用最高；追问「为什么」、自我解释、交错练习中等；划重点、重读、写摘要效用低。',
    use: '复习模块只做效用最高的两件事：测试和分散。',
    refs: [["Dunlosky, J., Rawson, K. A., Marsh, E. J., Nathan, M. J., & Willingham, D. T. (2013). Improving students' learning with effective learning techniques. Psychological Science in the Public Interest, 14(1), 4–58.", '10.1177/1529100612453266']] },
  { id: 'forgetting', cat: 'mem', lvl: 3, title: '遗忘曲线',
    find: 'Ebbinghaus 在 1885 年描述的遗忘曲线在 2015 年被完整重复：学完后的几小时到一天里遗忘最快，之后逐渐放缓。',
    use: '新卡片在第二天安排第一次复习。',
    refs: [["Murre, J. M. J., & Dros, J. (2015). Replication and analysis of Ebbinghaus' forgetting curve. PLOS ONE, 10(7), e0120644.", '10.1371/journal.pone.0120644']] },
  { id: 'interleave', cat: 'mem', lvl: 2, title: '交错练习',
    find: 'Rohrer 与 Taylor 的实验中，把不同类型的数学题混在一起练的学生，一周后测验成绩明显高于按类型集中练的学生。',
    use: '复习时不同卡组的卡片会打乱混合出现。',
    refs: [['Rohrer, D., & Taylor, K. (2007). The shuffling of mathematics problems improves learning. Instructional Science, 35(6), 481–498.', '10.1007/s11251-007-9015-8']] },
  { id: 'sleep', cat: 'mem', lvl: 3, title: '睡眠帮助巩固记忆',
    find: '大量研究表明，学习之后的睡眠有助于把新记忆巩固进长期记忆。',
    use: '习惯模板里有「睡前回想今天学到的 3 件事」；复习适合放在白天，别靠熬夜突击。',
    refs: [['Diekelmann, S., & Born, J. (2010). The memory function of sleep. Nature Reviews Neuroscience, 11(2), 114–126.', '10.1038/nrn2762']] },
  { id: 'exercise', cat: 'mem', lvl: 2, title: '运动与认知',
    find: '综述证据显示，规律的有氧运动与更好的注意力、执行功能和记忆相关。',
    use: '「体魄」领域与习惯模板「午饭后散步 10 分钟」。',
    refs: [['Hillman, C. H., Erickson, K. I., & Kramer, A. F. (2008). Be smart, exercise your heart: Exercise effects on brain and cognition. Nature Reviews Neuroscience, 9(1), 58–65.', '10.1038/nrn2298']] },
  // ---- 动机与同伴 ----
  { id: 'sdt', cat: 'social', lvl: 3, title: '自主、胜任、关系：持久动机的来源',
    find: '自我决定理论认为，人有三种基本心理需要：自主（这是我自己选的）、胜任（我做得到）、关系（我和别人连在一起）。Ng 等人对健康领域 184 组数据的元分析显示，支持自主的环境与更强的自主感、胜任感和更好的身心健康相关。',
    use: '目标和习惯由你自己定，「为什么」用你自己的话写；小组用来彼此支持，而不是互相施压。',
    refs: [['Ryan, R. M., & Deci, E. L. (2000). Self-determination theory and the facilitation of intrinsic motivation, social development, and well-being. American Psychologist, 55(1), 68–78.', '10.1037/0003-066X.55.1.68'],
      ['Ng, J. Y. Y., Ntoumanis, N., Thøgersen-Ntoumani, C., Deci, E. L., Ryan, R. M., Duda, J. L., & Williams, G. C. (2012). Self-determination theory applied to health contexts: A meta-analysis. Perspectives on Psychological Science, 7(4), 325–340.', '10.1177/1745691612447309']] },
  { id: 'selfcomp', cat: 'social', lvl: 2, title: '自我同情让人更想改进',
    find: 'Breines 与 Chen 的四项实验中，想起自己的弱点、过错或考砸之后，被引导用理解和宽容的态度对待自己的人，更愿意为下次考试多复习、更愿意弥补过错，也更相信弱点能改。自我同情不是放纵，而是让人敢于面对失败。',
    use: '晚省提醒你「像对朋友一样对自己说话」；漏掉、拖延时的提示都不责备。',
    refs: [['Breines, J. G., & Chen, S. (2012). Self-compassion increases self-improvement motivation. Personality and Social Psychology Bulletin, 38(9), 1133–1143.', '10.1177/0146167212445599']] },
  { id: 'socialinc', cat: 'social', lvl: 2, title: '和别人一起，更容易坚持',
    find: 'Patel 等人对约 600 名超重员工的随机试验（STEP UP）发现：在目标和计步之外加入社会元素，三种方式都增加了步数，竞争组每天多约 920 步、支持组多约 690 步、合作组多约 640 步；干预停止后只有竞争组的效果仍然显著。',
    use: '「小组」让成员看到彼此每周的打卡和完成情况，可以为别人鼓掌。竞争效果最大，但容易让落后的人泄气，所以这里没有排行榜。',
    refs: [['Patel, M. S., Small, D. S., Harrison, J. D., et al. (2019). Effectiveness of behaviorally designed gamification interventions with social incentives for increasing physical activity among overweight and obese adults across the United States: The STEP UP randomized clinical trial. JAMA Internal Medicine, 179(12), 1624–1632.', '10.1001/jamainternmed.2019.3505']] },
  { id: 'public', cat: 'social', lvl: 1, title: '分享行动，而不是宣布身份',
    find: 'Gollwitzer 等人的四项实验发现：「我要成为某种人」的意图被别人注意到之后，人们反而投入得更少，因为被认可让人提前有了「已经是了」的满足感。这个效应只出现在对该身份目标很投入的人身上。',
    use: '小组里分享的是实际的打卡数和完成数，不分享宏大的宣言。',
    refs: [['Gollwitzer, P. M., Sheeran, P., Michalski, V., & Seifert, A. E. (2009). When intentions go public: Does social reality widen the intention-behavior gap? Psychological Science, 20(5), 612–618.', '10.1111/j.1467-9280.2009.02336.x']] },
  // ---- 古典与思想 ----
  { id: 'six', cat: 'classic', lvl: 0, title: '「完整之人」的六个领域从哪里来',
    find: '默认的六个领域：体魄、学问、技艺、品格、人伦、事业。它参考了周代的六艺、柏拉图的体育与音乐、罗马的 humanitas 与自由七艺、《大学》的修身齐家，以及荣格对「完整」而不是「完美」的强调。它是一个综合，不是任何一个传统的原样照搬。',
    modern: '多领域平衡没有统一的实证标准。这里把它当作自省的镜子，而不是评分。',
    use: '领域可以随意改名、增删；回顾里的「完整度」按领域统计你的投入。',
    refs: [] },
  { id: 'liuyi', cat: 'classic', lvl: 0, title: '六艺与「游于艺」',
    find: '《周礼·地官·保氏》记载以「六艺」教导贵族子弟：五礼、六乐、五射、五驭、六书、九数，也就是礼仪、音乐、射箭、驾车、文字、算术，身体、审美、伦理和智识并重。孔子说：「志于道，据于德，依于仁，游于艺。」',
    use: '体魄、技艺、学问、人伦四个领域，都能在六艺里找到对应。',
    refs: [['《周礼·地官·保氏》'], ['《论语·述而》']] },

/* ================= focus timer (per device) ================= */
function freshTimer(keepTask) { const s = settings(); return { phase: 'focus', running: false, endAt: null, remain: s.focus * 60000, total: s.focus * 60000, taskId: keepTask || null, goal: '', startedAt: null, cycle: 0, dist: 0, pf: {} }; }
let T = LS.get(K.TIMER, null) || freshTimer();
const saveT = () => LS.set(K.TIMER, T);
let audioCtx = null, wakeLock = null;
function ensureAudio() { try { if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); } if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) {} }
function beep(long) {
  if (!settings().sound || !audioCtx) return;
  try {
    (long ? [660, 880, 990] : [880, 660]).forEach((f, i) => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = f; o.type = 'sine'; const t0 = audioCtx.currentTime + i * 0.22; g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2); o.connect(g).connect(audioCtx.destination); o.start(t0); o.stop(t0 + 0.22); });
  } catch (e) {}
  try { navigator.vibrate && navigator.vibrate([180, 90, 180]); } catch (e) {}
}
async function wakeOn() { try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) { wakeLock = null; } }
function wakeOff() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }
const leftMs = () => T.running ? Math.max(0, T.endAt - Date.now()) : T.remain;
function tStart() { if (T.running) return; ensureAudio(); if (!T.startedAt && T.phase === 'focus') T.startedAt = Date.now(); T.endAt = Date.now() + T.remain; T.running = true; saveT(); wakeOn(); render(); }
function tPause() { if (!T.running) return; T.remain = Math.max(0, T.endAt - Date.now()); T.running = false; T.endAt = null; saveT(); wakeOff(); render(); }
function recordSession(min) {
  const st = T.startedAt ? new Date(T.startedAt) : new Date(Date.now() - min * 60000);
  const k = dkey(st), mk = k.slice(0, 7), task = T.taskId ? getDoc(T.taskId) : null;
  const log = clone(getLog(mk)); log.focus = log.focus || [];
  log.focus.push({ sid: mkid('s'), d: k, t: `${pad(st.getHours())}:${pad(st.getMinutes())}`, min: Math.round(min * 10) / 10, task: task ? task.id : null, title: task ? task.title : (T.goal || ''), dist: T.dist || 0 });
  Store.put('log_' + mk, log);
  if (task) upd(task.id, t => { t.actMin = Math.round(((t.actMin || 0) + min) * 10) / 10; });
}
function tComplete() {
  const wasFocus = T.phase === 'focus'; T.running = false; T.endAt = null; wakeOff();
  const s = settings();
  if (wasFocus && T.custom) {
    recordSession(T.total / 60000);
    T.phase = 'focus'; T.custom = false; T.total = T.remain = s.focus * 60000; T.startedAt = null; T.dist = 0;
    beep(true); toast('5 分钟到了。想继续，就开始一轮完整的专注');
  } else if (wasFocus) {
    recordSession(T.total / 60000);
    T.cycle = (T.cycle || 0) + 1;
    const long = T.cycle % s.longEvery === 0;
    T.phase = 'break'; T.long = long; T.total = T.remain = (long ? s.longBrk : s.brk) * 60000; T.startedAt = null; T.dist = 0; T.pf = {};
    beep(true); toast(long ? `完成第 ${T.cycle} 轮，该长休息一下了` : `完成一轮专注，休息 ${s.brk} 分钟`);
  } else {
    T.phase = 'focus'; T.total = T.remain = s.focus * 60000; T.startedAt = null; T.long = false;

  }

}
function tStop() {
  if (T.phase === 'focus' && T.startedAt) {
    const elapsed = (T.total - leftMs()) / 60000;
    if (elapsed >= 1) { recordSession(elapsed); toast(`已记录 ${Math.round(elapsed)} 分钟专注`); if (T.taskId && getDoc(T.taskId)) { const tid = T.taskId; setTimeout(() => openResume(tid), 50); } }
  }

}
function tSkipBreak() { const s = settings(); T.phase = 'focus'; T.running = false; T.endAt = null; T.total = T.remain = s.focus * 60000; T.startedAt = null; T.long = false; saveT(); wakeOff(); render(); }
function startFocusOn(taskId, minutes, goal) {
  if (T.running && T.phase === 'focus') { toast('正在专注中，先结束当前这一轮'); go('focus'); return; }
  T = freshTimer(taskId); if (minutes) { T.total = T.remain = minutes * 60000; T.custom = true; }
  if (goal) T.goal = goal; saveT(); go('focus'); tStart();

  try { const o = JSON.parse(unb64url(m[1])); if (o && o.o && o.r && o.t && o.i) return o; } catch (e) {}

}

async function verifyRepo(owner, repo, token) {
  const r = await gfetch(`${GH_API}/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`, { headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' }, cache: 'no-store' });
  if (!r.ok) throw await ghErr(r);
  return r.json();
}
function enterReal() { S.mode = 'real'; S.docs = new Map(); S.tomb = new Map(); S.demo = new Map(); S.rv = null; S.draft = null; S.open = null; T = freshTimer(); saveT(); }

  if (!getDoc('settings')) Store.put('settings', Object.assign({ kind: 'settings', started: todayKey() }, DEFAULT_SETTINGS));
  if (!settings().areasSeeded) { if (!areas().length) AREA_SEED.forEach(a => Store.put(a.id, Object.assign({ kind: 'area' }, a))); upd('settings', s => { s.areasSeeded = true; }); }
}
async function connectWith(cfg, msgEl) {

  say('正在连接…');
  let info;
  try { info = await verifyRepo(cfg.owner, cfg.repo, cfg.token); } catch (e) { say(e.message || '连接失败', 'red'); return false; }
  const wasDemo = S.mode === 'demo';
  CFG = cfg; saveCfg();
  SP.p.st = { dirty: true }; SP.t.st = { dirty: true }; saveSt('p'); saveSt('t'); Sync.last = 0; LS.set(K.SYNC + 'last', 0); Sync.status = 'idle';
  if (wasDemo) enterReal();
  let ok = await Sync.run();
  if (ok) { ensureSeeds(); ok = await Sync.run(); }
  if (!ok) { say(Sync.msg || '同步失败', 'red'); return false; }
  closeSheet(true);
  toast(`已连接 ${info.full_name}`);
  if (!info.private) setTimeout(() => toast('注意：这个仓库是公开的，任何人都能看到记录。请在仓库设置里改为 Private。'), 2800);
  go(S.view === 'lists' ? 'lists' : 'today');

}
async function peekMembers(cfg) {
  try {
    const root = String(cfg.root || 'zhixing').replace(/^\/+|\/+$/g, ''), path = (root ? root + '/' : '') + 'group/team.json';
    const r = await gfetch(`${GH_API}/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${path.split('/').map(encodeURIComponent).join('/')}${cfg.branch ? '?ref=' + encodeURIComponent(cfg.branch) : ''}`, { headers: { Authorization: 'Bearer ' + cfg.token, Accept: 'application/vnd.github.raw+json' }, cache: 'no-store' });
    if (!r.ok) return [];
    const data = JSON.parse(await r.text());
    return Object.entries(data.docs || {}).filter(([, d]) => d && d.kind === 'member').map(([id, d]) => ({ id: id.replace(/^m_/, ''), name: d.name }));
  } catch (e) { return []; }
}

function revealTask(id) {
  const t = getDoc(id); if (!t) return;
  const k = todayKey();
  let v = 'anytime', vid = null;
  if (t.done) v = 'logbook';
  else if (t.sp && t.assignee !== myId()) { v = 'project'; vid = t.project; }
  else if (inInbox(t)) v = 'inbox';
  else if ((t.date && t.date <= k) || (t.deadline && t.deadline <= k)) v = 'today';
  else if (t.date) v = 'upcoming';
  else if (listOf(t) === 'someday') v = 'someday';
  else if (t.project) { v = 'project'; vid = t.project; }
  go(v, vid); S.open = id; render();
  setTimeout(() => { const el = $('.editor'); if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 60);
}

function deleteProject(id, el) {

  for (const t of projTasks(id)) upd(t.id, x => { x.project = ''; if (!x.sp) x.area = p && p.area || ''; });

  for (const t of open) upd(t.id, x => { x.done = true; x.doneAt = k; if (x.sp) x.doneBy = myId(); });

function saveFile(name, text, mime) {
  const blob = new Blob([text], { type: mime });
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios && navigator.canShare) { try { const f = new File([blob], name, { type: mime }); if (navigator.canShare({ files: [f] })) { navigator.share({ files: [f] }).catch(() => {}); return; } } catch (e) {} }

  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000); toast('已下载：' + name);
}

const onChange = {
  fTask: el => { T.taskId = el.value || null; saveT(); render(); },
  stTask: el => { S.stuckTask = el.value || null; const t = el.value ? getDoc(el.value) : null; const st = $('#stStep'); const f = t && (t.checklist || []).find(c => !c.d); if (st && f) st.value = f.t; },
  edText: () => commitEditor(false)
};
document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.on; if (k && onInput[k]) onInput[k](e.target); if (e.target.closest && e.target.closest('.ritual') && e.target.tagName === 'TEXTAREA') { e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; } });
document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.on; if (k && onChange[k]) onChange[k](e.target); if (e.target.id === 'importFile' && e.target.files[0]) { handleImport(e.target.files[0]); e.target.value = ''; } });
let lastCompose = 0;
document.addEventListener('compositionend', () => { lastCompose = Date.now(); });
document.addEventListener('keydown', e => {
  const tg = e.target, typing = /INPUT|TEXTAREA|SELECT/.test(tg.tagName);
  if (e.key === 'Enter' && (e.isComposing || e.keyCode === 229 || Date.now() - lastCompose < 120)) return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSearch(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'n') { e.preventDefault(); ACT.fab(); return; }
  if (e.key === 'Escape') { if (S.menuOpen) { closeMenu(); return; } if (sheetOpen()) { closeSheet(); return; } if (S.open) { closeEditor(); return; } }
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    if (tg.id === 'edTitle') { e.preventDefault(); closeEditor(); return; }
    if (tg.id === 'edStep') { e.preventDefault(); if (tg.value.trim()) { commitEditor(false); render(); const n = $('#edStep'); if (n) n.focus(); } return; }
    if (tg.id === 'fPark') { e.preventDefault(); ACT.park(); return; }
    if (tg.id === 'qTitle') { e.preventDefault(); saveQuick(); return; }
  }
  if (S.view === 'review' && S.rv && !sheetOpen() && !typing) {
    if (e.key === ' ' && !S.rv.shown) { e.preventDefault(); ACT.reveal(); }
    else if (S.rv.shown && /^[1-4]$/.test(e.key)) gradeCard(Number(e.key) - 1);
  }
});
/* tooltips */
const tipEl = $('#tip'); let tipTimer = null;
function showTip(el, touch) {
  tipEl.textContent = el.dataset.tip; tipEl.hidden = false;
  const r = el.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  const x = clamp(r.left + r.width / 2 - w / 2, 8, innerWidth - w - 8); let y = r.top - h - 8; if (y < 8) y = r.bottom + 8;
  tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
  clearTimeout(tipTimer); if (touch) tipTimer = setTimeout(hideTip, 2600);
}
function hideTip() { tipEl.hidden = true; }
document.addEventListener('pointerover', e => { if (e.pointerType === 'touch') return; const el = e.target.closest('[data-tip]'); if (el) showTip(el); });
document.addEventListener('pointerout', e => { if (e.pointerType === 'touch') return; const el = e.target.closest('[data-tip]'); if (el && !el.contains(e.relatedTarget)) hideTip(); });
window.addEventListener('scroll', () => { hideTip(); onScroll(); }, { passive: true });

/* ================= toast ================= */
let toastTimer = null;
function toast(msg, actLabel, actFn) {
  const el = $('#toast'); el.innerHTML = `<span>${esc(msg)}</span>${actLabel ? `<button id="toastAct">${esc(actLabel)}</button>` : ''}`; el.hidden = false;
  el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
  if (actLabel) $('#toastAct').onclick = () => { el.hidden = true; actFn && actFn(); };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, actLabel ? 5000 : 2600);
}

/* ================= boot ================= */
function boot() {
  paintIcons();
  const loc = LS.get(K.DATA, null);
  if (loc && loc.docs) {
    S.docs = new Map(Object.entries(loc.docs));
    S.tomb = new Map(Object.entries(loc.tomb || {}).map(([id, v]) => [id, typeof v === 'number' ? { t: v, s: 'p' } : v]));
  } else {
    const old = LS.get(K.OLD_DOCS, null);
    if (old && old.docs && Object.keys(old.docs).length) for (const [id, d] of Object.entries(old.docs)) { const u = upgradeDoc(d); if (u) S.docs.set(id, Object.assign(u, { id })); }
  }
  if (S.docs.size || ghOn()) {
    S.mode = 'real';
    if (!CFG || !CFG.me) { CFG = Object.assign(CFG || {}, { me: { id: 'local' + Math.random().toString(36).slice(2, 6), name: '我', color: 0 } }); saveCfg(); }
    if (!ghOn()) { ensureSeeds(); }
    saveLocalNow();
  } else { S.mode = 'demo'; S.demo = buildDemo(); S.demo.get('m_u_me').progress = myProgress(); }
  const ui = LS.get(K.UI, {}) || {}, h = (location.hash || '').replace('#', '');
  let joinCode = '';
  if (h.startsWith('join=')) { joinCode = h.slice(5); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  else if (VIEWS[h] && !['area', 'project'].includes(h)) S.view = h;
  else if (ui.view && VIEWS[ui.view]) { S.view = ui.view; S.vid = ui.vid || null; if ((S.view === 'area' || S.view === 'project') && !getDoc(S.vid)) { S.view = 'today'; S.vid = null; } }
  if (T.running && Date.now() >= T.endAt) tComplete(); else if (T.running) wakeOn();
  render(); onScroll();
  if (joinCode) openJoin(joinCode);
  Sync.run();
  setInterval(tTick, 250);
  let lastDay = todayKey();
  setInterval(() => { const k = todayKey(); if (k !== lastDay) { lastDay = k; render({ passive: true }); } }, 30000);
  setInterval(() => { if (document.visibilityState === 'visible') Sync.run(); }, 90000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { commitEditor(false); saveLocalNow(); if (SP.p.st.dirty || SP.t.st.dirty) Sync.run(); } else { tTick(); if (T.running) wakeOn(); Sync.run(); } });
  window.addEventListener('online', () => Sync.run());
  window.addEventListener('pagehide', () => { commitEditor(false); saveLocalNow(); });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
}
boot();
</script>
